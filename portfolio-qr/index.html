<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090d">
  <title>Portfolio — Raju</title>
  <meta name="description" content="A visual portfolio presentation.">
  <style>
    :root { color-scheme: dark; --bg:#08090d; --text:#f5f5f7; --muted:#a7a7b0; }
    * { box-sizing: border-box; }
    html { min-height:100%; background:var(--bg); }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:clamp(16px,4vw,48px); background:radial-gradient(ellipse at 50% 0%, rgba(27,93,255,.15), transparent 48%),var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif; }
    main { width:min(1100px,100%); }
    header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin:0 0 22px; }
    .brand { font-size:clamp(19px,3vw,28px); font-weight:650; letter-spacing:-.045em; }
    .caption { color:var(--muted); font-size:13px; letter-spacing:.02em; }
    .frame { overflow:hidden; border-radius:clamp(12px,2vw,24px); background:#111216; border:1px solid rgba(255,255,255,.12); box-shadow:0 28px 90px rgba(0,0,0,.42),0 0 0 1px rgba(255,255,255,.025); opacity:0; transform:translateY(12px) scale(.985); animation:arrive 900ms cubic-bezier(.2,.75,.25,1) 100ms forwards; }
    .frame img { display:block; width:100%; height:auto; transform:scale(1.015); animation:settle 1400ms cubic-bezier(.2,.75,.25,1) 100ms forwards; }
    footer { text-align:center; color:var(--muted); font-size:12px; padding-top:18px; }
    @keyframes arrive { to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes settle { to { transform:scale(1); } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-delay:0ms!important; } .frame { opacity:1; transform:none; } .frame img { transform:none; } }
  </style>
</head>
<body>
  <main>
    <header><div class="brand">Portfolio<span aria-hidden="true">.</span></div><div class="caption">A visual introduction</div></header>
    <section class="frame" aria-label="Portfolio image"><img src="assets/portfolio.png" alt="Portfolio design preview"></section>
    <footer>Designed to be viewed on any screen.</footer>
  </main>
</body>
</html>
